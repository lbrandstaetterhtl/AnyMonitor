<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnyMonitor</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    section { border: 1px solid #8884; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
    input, button { font: inherit; padding: 4px 8px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
    th, td { padding: 5px 8px; border-bottom: 1px solid #8883; text-align: left; white-space: nowrap; }
    th { font-weight: 600; font-size: 12px; }
    .r { text-align: right; }
    .ok { color: #1f8a4c; font-weight: 600; }
    .bad { color: #d0453c; font-weight: 600; }
    .muted { color: GrayText; }
    #msg { color: #d0453c; min-height: 1.5em; margin: 8px 0 0; }
  </style>
</head>
<body>

<header>
  <h1>AnyMonitor</h1>
  <label>API-Key <input id="key" type="password" autocomplete="off"></label>
</header>
<p id="msg"></p>

<section>
  <h2>Status</h2>
  <button id="btnStatus">Abrufen</button>
  <span id="status" class="muted"></span>
</section>

<section>
  <h2>Monitore</h2>
  <form id="startForm">
    <input id="target" placeholder="Ziel-IP" value="127.0.0.1" required>
    <label>alle <input id="interval" type="number" min="1" value="5" style="width: 60px"> s</label>
    <button>ICMP-Monitor starten</button>
  </form>
  <table id="monitors"></table>
</section>

<section id="historySection" hidden>
  <h2>Verlauf <span id="historyTitle" class="muted"></span></h2>
  <table>
    <thead>
    <tr><th>Zeit</th><th>Status</th><th class="r">Antworten</th><th class="r">Verlust</th><th class="r">Ø RTT</th><th>Fehler</th></tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
</section>

<script>
  const $ = (id) => document.getElementById(id);

  // ---------- API ----------

  $("key").value = localStorage.getItem("am.key") ?? "";
  $("key").onchange = () => localStorage.setItem("am.key", $("key").value);

  async function api(method, path, body) {
    const headers = { "x-api-key": $("key").value };
    if (body) headers["Content-Type"] = "application/json";

    const res = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
    const text = await res.text();

    if (!res.ok) {
      const err = new Error(`${res.status} ${res.statusText}${text ? ": " + text : ""}`);
      err.status = res.status;
      throw err;
    }
    return text ? JSON.parse(text) : null;
  }

  async function run(action) {
    try {
      await action();
      $("msg").textContent = "";
    } catch (e) {
      $("msg").textContent = e.status === 401 ? "API-Key fehlt oder ist falsch." : e.message;
    }
  }

  // ---------- Status ----------

  $("btnStatus").onclick = () => run(async () => {
    const s = await api("GET", "/status");
    const p = s.process ?? {};
    const h = Math.floor(s.uptime_sec / 3600);
    const m = Math.floor((s.uptime_sec % 3600) / 60);
    $("status").textContent =
            `Uptime ${h}h ${m}m ${s.uptime_sec % 60}s · RAM ${p.memory_mb ?? "–"} MB · CPU ${p.cpu_usage_percent?.toFixed(1) ?? "–"} %`;
  });

  // ---------- Monitore ----------

  let monitors = JSON.parse(localStorage.getItem("am.monitors") ?? "[]");
  let selected = null;
  let timer = null;

  function saveMonitors() {
    localStorage.setItem("am.monitors", JSON.stringify(monitors));
    renderMonitors();
  }

  function renderMonitors() {
    const table = $("monitors");
    table.replaceChildren();
    for (const m of monitors) {
      const tr = table.insertRow();
      tr.insertCell().textContent = m.target;
      const idCell = tr.insertCell();
      idCell.textContent = m.id;
      idCell.className = "muted";

      const actions = tr.insertCell();
      actions.className = "r";
      actions.append(button("Verlauf", () => select(m)), " ", button("Stoppen", () => run(() => stop(m.id))));
    }
  }

  function button(label, onClick) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = onClick;
    return b;
  }

  $("startForm").onsubmit = (e) => {
    e.preventDefault();
    run(async () => {
      const target = $("target").value.trim();
      const res = await api("POST", "/monitor/start", {
        target,
        strategy: "icmp",
        interval_sec: Number($("interval").value),
      });
      const m = { id: res.id, target };
      monitors.unshift(m);
      saveMonitors();
      select(m);
    });
  };

  async function stop(id) {
    try {
      await api("DELETE", `/monitor/stop/${id}`);
    } catch (e) {
      // 417: Server kennt den Monitor nicht mehr (z. B. nach einem Neustart) → trotzdem aus der Liste nehmen
      if (e.status !== 417) throw e;
    }
    monitors = monitors.filter((m) => m.id !== id);
    saveMonitors();
    if (selected?.id === id) select(null);
  }

  // ---------- Verlauf ----------

  function select(monitor) {
    selected = monitor;
    clearInterval(timer);
    $("historySection").hidden = !monitor;
    if (!monitor) return;

    $("historyTitle").textContent = `${monitor.target} · aktualisiert alle 5 s`;
    $("history").replaceChildren();
    run(loadHistory);
    timer = setInterval(() => run(loadHistory), 5000);
  }

  async function loadHistory() {
    if (!selected) return;
    const { history } = await api("GET", `/monitor/history/${selected.id}`);

    const tbody = $("history");
    tbody.replaceChildren();
    for (const r of history.slice().reverse()) {
      const tr = tbody.insertRow();
      const online = r.online ?? r.received > 0;
      const errors = (r.errors ?? [r.error]).filter(Boolean).join(", ");

      cell(tr, new Date(r.at).toLocaleTimeString());
      cell(tr, online ? "online" : "offline", online ? "ok" : "bad");
      cell(tr, `${r.received}/${r.sent}`, "r");
      cell(tr, `${Math.round(r.loss_percent)} %`, "r");
      cell(tr, r.avg_rtt_ms != null ? `${r.avg_rtt_ms.toFixed(2)} ms` : "–", "r");
      cell(tr, errors || "–", errors ? "" : "muted");
    }
  }

  function cell(tr, text, className) {
    const td = tr.insertCell();
    td.textContent = text;
    if (className) td.className = className;
  }

  renderMonitors();
</script>

</body>
</html>
